<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#14532d"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Frantreesa Mini Mart & Cold Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
<style>
:root{
  --green-900:#052e16;--green-800:#14532d;--green-700:#166534;--green-600:#16a34a;
  --green-500:#22c55e;--green-400:#4ade80;--green-100:#dcfce7;--green-50:#f0fdf4;
  --amber-700:#b45309;--amber-500:#f59e0b;--amber-400:#fbbf24;--amber-100:#fef3c7;--amber-50:#fffbeb;
  --red-600:#dc2626;--red-100:#fee2e2;--red-50:#fff0f0;
  --blue-600:#2563eb;--blue-100:#dbeafe;
  --gray-900:#111827;--gray-800:#1f2937;--gray-700:#374151;--gray-600:#4b5563;
  --gray-500:#6b7280;--gray-400:#9ca3af;--gray-300:#d1d5db;--gray-200:#e5e7eb;
  --gray-100:#f3f4f6;--gray-50:#f9fafb;
  --bg:#fafaf8;--surface:#ffffff;--surface2:#f6f5f2;
  --radius:10px;--radius-lg:14px;--radius-xl:20px;
  --font:'DM Sans',sans-serif;--font-serif:'DM Serif Display',serif;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 4px 16px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--gray-900);font-size:15px;line-height:1.5;overscroll-behavior:none}
input,select,button,textarea{font-family:var(--font)}
button{cursor:pointer;border:none;background:none}
input,select{border:1.5px solid var(--gray-200);border-radius:var(--radius);padding:9px 12px;font-size:14px;color:var(--gray-900);background:var(--surface);width:100%;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--green-600)}
input[type=number]::-webkit-inner-spin-button{opacity:1}

/* ── LAYOUT ── */
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--surface)}
.page{display:none;flex:1;overflow-y:auto;padding:12px 14px 80px;animation:fadeUp .18s ease}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── HEADER ── */
.header{background:var(--green-800);padding:14px 16px 12px;position:sticky;top:0;z-index:50;flex-shrink:0}
.header-top{display:flex;align-items:center;justify-content:space-between}
.logo-sub{font-size:10px;color:#86efac;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
.logo-main{font-family:var(--font-serif);font-size:17px;color:#fff;margin-top:1px}
.header-badge{background:rgba(255,255,255,.15);border-radius:20px;padding:4px 10px;font-size:11px;color:#fff;cursor:pointer;border:1px solid rgba(255,255,255,.2)}
.header-badge.warn{background:rgba(245,158,11,.2);border-color:rgba(245,158,11,.4);color:#fde68a}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--gray-200);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-btn{flex:1;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;cursor:pointer;position:relative;transition:color .15s}
.nav-btn svg{transition:stroke .15s}
.nav-btn span{font-size:10px;color:var(--gray-500);font-weight:500;transition:color .15s}
.nav-btn.active span{color:var(--green-700)}
.nav-badge{position:absolute;top:4px;right:calc(50% - 16px);background:var(--red-600);color:#fff;font-size:9px;border-radius:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-weight:600;padding:0 3px}
.nav-badge.warn{background:var(--amber-500)}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:14px 16px;box-shadow:var(--shadow)}
.card+.card{margin-top:10px}

/* ── STAT CARDS ── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:var(--surface);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:12px 14px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.stat-card.green::before{background:var(--green-600)}
.stat-card.blue::before{background:var(--blue-600)}
.stat-card.amber::before{background:var(--amber-500)}
.stat-card.red::before{background:var(--red-600)}
.stat-label{font-size:11px;color:var(--gray-500);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:4px}
.stat-value{font-size:20px;font-weight:600;color:var(--gray-900)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;border:1.5px solid transparent}
.btn-primary{background:var(--green-700);color:#fff;border-color:var(--green-700)}
.btn-primary:hover{background:var(--green-800)}
.btn-primary:active{transform:scale(.98)}
.btn-secondary{background:var(--surface2);color:var(--gray-700);border-color:var(--gray-200)}
.btn-secondary:hover{background:var(--gray-100)}
.btn-danger{background:var(--red-100);color:var(--red-600);border-color:#fca5a5}
.btn-danger:hover{background:#fecaca}
.btn-amber{background:var(--amber-100);color:var(--amber-700);border-color:#fde68a}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-full{width:100%;padding:12px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ── SECTION TITLES ── */
.section-title{font-size:12px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.8px;margin:16px 0 8px}

/* ── PRODUCT CARDS ── */
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.product-tile{background:var(--surface);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:10px 12px;cursor:pointer;transition:all .15s;position:relative}
.product-tile:active{transform:scale(.97)}
.product-tile.out{opacity:.5;pointer-events:none}
.product-tile.low{border-color:#fde68a}
.product-name{font-size:13px;font-weight:500;color:var(--gray-900);line-height:1.3;margin-bottom:2px}
.product-cat{font-size:11px;color:var(--gray-400);margin-bottom:6px}
.product-footer{display:flex;justify-content:space-between;align-items:center}
.product-price{font-size:15px;font-weight:600;color:var(--green-700)}
.product-qty{font-size:11px;color:var(--gray-500)}
.product-qty.low-text{color:var(--amber-700);font-weight:600}
.product-qty.out-text{color:var(--red-600);font-weight:600}
.stock-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;flex-shrink:0}

/* ── INVENTORY ROWS ── */
.inv-row{background:var(--surface);border:1px solid var(--gray-200);border-radius:var(--radius);padding:12px 14px;margin-bottom:6px;cursor:pointer;transition:background .12s;display:flex;align-items:center;gap:10px}
.inv-row:hover{background:var(--gray-50)}
.inv-info{flex:1;min-width:0}
.inv-name{font-size:14px;font-weight:500;color:var(--gray-900)}
.inv-meta{font-size:12px;color:var(--gray-400);margin-top:1px}
.inv-right{text-align:right;flex-shrink:0}
.inv-price{font-size:14px;font-weight:600;color:var(--green-700)}
.inv-stock{font-size:12px;color:var(--gray-500);margin-top:1px}

/* ── CATEGORY PILLS ── */
.cat-scroll{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;margin-bottom:4px;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-pill{flex-shrink:0;padding:5px 13px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--gray-200);color:var(--gray-600);background:var(--surface);transition:all .15s;white-space:nowrap}
.cat-pill.active{background:var(--green-700);color:#fff;border-color:var(--green-700)}

/* ── CART ── */
.cart-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--gray-100)}
.cart-item:last-child{border-bottom:none}
.cart-name{flex:1;font-size:13px;color:var(--gray-800);font-weight:500}
.qty-ctrl{display:flex;align-items:center;gap:5px}
.qty-btn{width:26px;height:26px;border-radius:7px;background:var(--gray-100);color:var(--gray-700);font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;border:1px solid var(--gray-200);transition:background .12s}
.qty-btn:hover{background:var(--gray-200)}
.qty-num{font-size:13px;font-weight:600;min-width:22px;text-align:center;color:var(--gray-900)}
.cart-total{font-size:13px;font-weight:600;color:var(--green-700);min-width:64px;text-align:right}
.remove-btn{color:var(--gray-400);font-size:18px;line-height:1;padding:0 2px}
.remove-btn:hover{color:var(--red-600)}

/* ── MODALS ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s ease}
.modal-overlay.hidden{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-sheet{background:var(--surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:20px 18px 32px;animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:16px;font-weight:600;color:var(--gray-900)}
.modal-close{width:30px;height:30px;border-radius:50%;background:var(--gray-100);color:var(--gray-600);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none}
.form-group{margin-bottom:12px}
.form-label{font-size:12px;font-weight:600;color:var(--gray-600);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── TOAST ── */
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--gray-900);color:#fff;padding:9px 18px;border-radius:var(--radius);font-size:13px;z-index:999;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.success{background:var(--green-800)}
#toast.error{background:var(--red-600)}
#toast.warn{background:var(--amber-700)}

/* ── SALE ROWS ── */
.sale-row{background:var(--surface);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:8px}
.sale-row-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.sale-amount{font-size:16px;font-weight:600;color:var(--green-700)}
.sale-meta{font-size:11px;color:var(--gray-400);margin-top:2px}
.sale-items{font-size:12px;color:var(--gray-500);border-top:1px solid var(--gray-100);padding-top:6px;margin-top:4px}

/* ── BAR CHART ── */
.bar-row{margin-bottom:10px}
.bar-label{display:flex;justify-content:space-between;margin-bottom:3px;font-size:12px;color:var(--gray-700)}
.bar-track{height:7px;background:var(--gray-100);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--green-600);border-radius:4px;transition:width .5s ease}

/* ── SEARCH ── */
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap input{padding-left:36px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--gray-400)}

/* ── INLINE EDIT ── */
.price-edit-input{width:80px;padding:4px 8px;font-size:14px;font-weight:600;color:var(--green-700);border:1.5px solid var(--green-400);border-radius:6px;background:#f0fdf4;text-align:right}
.price-edit-input:focus{outline:none;border-color:var(--green-600)}

/* ── PAY METHODS ── */
.pay-pills{display:flex;gap:8px;margin:8px 0}
.pay-pill{flex:1;padding:9px;border-radius:var(--radius);border:1.5px solid var(--gray-200);background:var(--surface);font-size:13px;font-weight:500;color:var(--gray-600);cursor:pointer;text-align:center;transition:all .15s}
.pay-pill.active{background:var(--green-50);border-color:var(--green-600);color:var(--green-800)}

/* ── ALERT BOX ── */
.alert{border-radius:var(--radius);padding:10px 14px;margin-bottom:10px;font-size:13px;display:flex;align-items:flex-start;gap:8px}
.alert.warn{background:var(--amber-50);border:1px solid #fde68a;color:var(--amber-700)}
.alert.info{background:#eff6ff;border:1px solid #bfdbfe;color:var(--blue-600)}
.alert.success{background:var(--green-50);border:1px solid var(--green-400);color:var(--green-800)}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:40px 20px;color:var(--gray-400)}
.empty-icon{font-size:40px;margin-bottom:10px}
.empty p{font-size:14px}

/* ── CHECKOUT SUMMARY ── */
.checkout-line{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;border-bottom:1px solid var(--gray-100)}
.checkout-line:last-child{border-bottom:none}
.checkout-total{display:flex;justify-content:space-between;padding:12px 0 0;font-size:17px;font-weight:700;border-top:2px solid var(--gray-200);margin-top:6px}

/* ── CHANGE DISPLAY ── */
.change-display{background:var(--green-50);border:1.5px solid var(--green-400);border-radius:var(--radius);padding:10px 14px;text-align:center;margin-top:8px}
.change-display.over{background:var(--red-50);border-color:#fca5a5}
.change-label{font-size:11px;color:var(--gray-500);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.change-val{font-size:22px;font-weight:700;color:var(--green-700);margin-top:2px}
.change-val.over{color:var(--red-600)}

/* ── REPORT HIGHLIGHTS ── */
.top-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray-100)}
.top-item:last-child{border-bottom:none}
.rank-badge{width:22px;height:22px;border-radius:50%;background:var(--green-100);color:var(--green-800);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.top-name{flex:1;font-size:13px;font-weight:500;color:var(--gray-800)}
.top-val{font-size:13px;color:var(--gray-500)}

/* ── EXPORT BUTTON ── */
.export-row{display:flex;gap:8px;margin-top:12px}

/* ── LOADING ── */
#loading{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:9999}
.spinner{width:36px;height:36px;border:3px solid var(--gray-200);border-top-color:var(--green-700);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── RESPONSIVE TWEAKS ── */
@media(max-width:360px){
  .product-grid{grid-template-columns:1fr 1fr}
  .stat-value{font-size:17px}
}
</style>
</head>
<body>
<div id="loading">
  <div style="font-family:'DM Serif Display',serif;font-size:22px;color:#14532d;text-align:center">Frantreesa<br><span style="font-family:'DM Sans',sans-serif;font-size:14px;color:#6b7280;font-style:normal">Mini Mart & Cold Store</span></div>
  <div class="spinner"></div>
</div>

<div id="app" style="display:none">
  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <div>
        <div class="logo-sub">Frantreesa</div>
        <div class="logo-main">Mini Mart & Cold Store</div>
      </div>
      <div id="header-alert" class="header-badge warn" style="display:none" onclick="goTab('inventory')"></div>
    </div>
  </div>

  <!-- PAGES -->
  <div id="page-dashboard" class="page active"><div id="dash-content"></div></div>
  <div id="page-pos" class="page"><div id="pos-content"></div></div>
  <div id="page-inventory" class="page"><div id="inv-content"></div></div>
  <div id="page-sales" class="page"><div id="sales-content"></div></div>
  <div id="page-reports" class="page"><div id="reports-content"></div></div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-dashboard" onclick="goTab('dashboard')">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Dashboard</span>
    </button>
    <button class="nav-btn" id="nav-pos" onclick="goTab('pos')">
      <div style="position:relative">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span id="cart-badge" class="nav-badge" style="display:none"></span>
      </div>
      <span>Sell</span>
    </button>
    <button class="nav-btn" id="nav-inventory" onclick="goTab('inventory')">
      <div style="position:relative">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        <span id="stock-badge" class="nav-badge warn" style="display:none"></span>
      </div>
      <span>Stock</span>
    </button>
    <button class="nav-btn" id="nav-sales" onclick="goTab('sales')">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      <span>Sales</span>
    </button>
    <button class="nav-btn" id="nav-reports" onclick="goTab('reports')">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
      <span>Reports</span>
    </button>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- MODALS -->
<div id="modal-product" class="modal-overlay hidden" onclick="if(event.target===this)closeModal('product')">
  <div class="modal-sheet" id="product-form-sheet"></div>
</div>
<div id="modal-checkout" class="modal-overlay hidden" onclick="if(event.target===this)closeModal('checkout')">
  <div class="modal-sheet" id="checkout-sheet"></div>
</div>
<div id="modal-detail" class="modal-overlay hidden" onclick="if(event.target===this)closeModal('detail')">
  <div class="modal-sheet" id="detail-sheet"></div>
</div>
<div id="modal-price" class="modal-overlay hidden" onclick="if(event.target===this)closeModal('price')">
  <div class="modal-sheet" id="price-sheet"></div>
</div>

<script>
// ══════════════════════════════════════════════════
//  DATA LAYER  –  localStorage database
// ══════════════════════════════════════════════════
const DB = {
  get(k){ try{ return JSON.parse(localStorage.getItem('fm_'+k)); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem('fm_'+k,JSON.stringify(v)); }catch{} },
};

const CATEGORIES = ['All','Beverages','Snacks & Biscuits','Dairy & Eggs','Canned Goods','Grains & Rice',
  'Bread & Bakery','Cooking & Oil','Cleaning','Personal Care','Frozen / Cold Store',
  'Confectionery','Household','Provisions','Other'];

const SEED = [
  {id:'p01',name:'Coca-Cola 500ml',category:'Beverages',price:5,cost:3.5,qty:48,minQty:10,unit:'bottle'},

// ── STATE ──
let products = DB.get('products') || SEED;
let sales    = DB.get('sales')    || [];
let cart     = [];
let activeTab = 'dashboard';
let posSearch = '', posCat = 'All';
let invSearch = '', invCat = 'All';
let salesDate = '';
let editingProduct = null;

// ── SAVE ──
function saveProducts(){ DB.set('products', products); }
function saveSales(){ DB.set('sales', sales); }

// ── HELPERS ──
const GH = n => 'GH₵ ' + Number(n).toFixed(2);
const uid = () => 'p' + Date.now() + Math.random().toString(36).slice(2,6);
const todayStr = () => new Date().toLocaleDateString('en-GB');
const now = () => new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

function toast(msg, type='success'){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show ' + type;
  setTimeout(() => t.className = '', 3000);
}

function openModal(id){ document.getElementById('modal-'+id).classList.remove('hidden'); }
function closeModal(id){ document.getElementById('modal-'+id).classList.add('hidden'); }

// ── NAV ──
function goTab(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
  activeTab = tab;
  renderTab(tab);
}

function renderTab(tab){
  if(tab==='dashboard') renderDashboard();
  if(tab==='pos') renderPOS();
  if(tab==='inventory') renderInventory();
  if(tab==='sales') renderSales();
  if(tab==='reports') renderReports();
  updateBadges();
}

function updateBadges(){
  const low = products.filter(p=>p.qty<=p.minQty);
  const cartCount = cart.reduce((a,i)=>a+i.qty,0);
  const cb = document.getElementById('cart-badge');
  const sb = document.getElementById('stock-badge');
  const ha = document.getElementById('header-alert');
  cb.style.display = cartCount>0?'flex':'none'; cb.textContent=cartCount;
  sb.style.display = low.length>0?'flex':'none'; sb.textContent=low.length;
  if(low.length>0){ ha.style.display='block'; ha.textContent=low.length+' item'+(low.length>1?'s':'')+' low on stock'; }
  else { ha.style.display='none'; }
}

  const stockVal = products.reduce((a,p)=>a+(p.cost*p.qty),0);
  const low = products.filter(p=>p.qty<=p.minQty);
  const outOfStock = products.filter(p=>p.qty===0);

  let html = `
  <div class="stats-grid">
    <div class="stat-card green"><div class="stat-label">Today Revenue</div><div class="stat-value">${GH(rev)}</div></div>
    <div class="stat-card blue"><div class="stat-label">Today Profit</div><div class="stat-value">${GH(profit)}</div></div>
    <div class="stat-card amber"><div class="stat-label">Transactions</div><div class="stat-value">${todaySales.length}</div></div>
    <div class="stat-card red"><div class="stat-label">Stock Value</div><div class="stat-value">${GH(stockVal)}</div></div>
  </div>`;

      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0;margin-top:1px"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span><strong>${low.length} item${low.length>1?'s':''}</strong> running low. ${outOfStock.length>0?outOfStock.length+' out of stock.':''} <a href="#" onclick="goTab('inventory');return false" style="color:inherit;font-weight:600">View →</a></span>
    </div>`;
  }

  html += `<div class="section-title">Quick Actions</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
    <button class="btn btn-primary" onclick="goTab('pos')" style="padding:14px 8px">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      New Sale
    </button>
    <button class="btn btn-secondary" onclick="goTab('inventory')" style="padding:14px 8px">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Product
    </button>
    <button class="btn btn-secondary" onclick="goTab('sales')" style="padding:12px 8px">View Sales</button>
    <button class="btn btn-secondary" onclick="goTab('reports')" style="padding:12px 8px">Reports</button>
  </div>`;

  html += `<div class="section-title">Recent Sales</div>`;
  if(sales.length===0){ html += `<div class="empty"><div class="empty-icon">🛒</div><p>No sales yet. Tap Sell to get started!</p></div>`; }
  else {
    sales.slice(0,6).forEach(s=>{
      html += `<div class="sale-row">
        <div class="sale-row-head">
          <div><div style="font-size:13px;font-weight:600;color:var(--gray-800)">${s.items.length} item${s.items.length>1?'s':''}</div>

      </div>`;

  document.getElementById('dash-content').innerHTML = html;

function renderPOS(){
  const cats = ['All', ...new Set(products.map(p=>p.category))].slice(0,10);
  const filtered = products.filter(p=>{
    const mc = posCat==='All'||p.category===posCat;
    const ms = p.name.toLowerCase().includes(posSearch.toLowerCase())||p.category.toLowerCase().includes(posSearch.toLowerCase());
    return mc&&ms;
  });

  let html = `
  <div class="search-wrap">
    <svg class="search-icon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" placeholder="Search products..." value="${posSearch}" oninput="posSearch=this.value;renderPOS()" />
  </div>
  <div class="cat-scroll">`;
  cats.forEach(c=>{ html+=`<div class="cat-pill${posCat===c?' active':''}" onclick="posCat='${c}';renderPOS()">${c}</div>`; });
  html += '</div>';

  if(cart.length>0){
    const total = cartTotal();
    html += `<div class="card" style="margin-bottom:12px;border-color:#86efac">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:13px;font-weight:600">Cart (${cart.reduce((a,i)=>a+i.qty,0)} items)</span>
        <button class="btn btn-sm btn-danger" onclick="clearCart()">Clear</button>
      </div>`;
    cart.forEach(item=>{
      html+=`<div class="cart-item">
        <span class="cart-name">${item.name}</span>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="cartQty('${item.id}',-1)">−</button>
          <span class="qty-num">${item.qty}</span>
          <button class="qty-btn" onclick="cartQty('${item.id}',1)">+</button>
        </div>
        <span class="cart-total">${GH(item.price*item.qty)}</span>
        <button class="remove-btn" onclick="removeFromCart('${item.id}')">×</button>
      </div>`;
    });
    html+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:2px solid var(--gray-200)">
      <span style="font-size:16px;font-weight:700">Total: ${GH(total)}</span>
      <button class="btn btn-primary" onclick="openCheckout()">Checkout →</button>
    </div></div>`;
  }

  html += '<div class="product-grid">';
  filtered.forEach(p=>{
    const isOut = p.qty===0;
    const isLow = p.qty>0&&p.qty<=p.minQty;
    html+=`<div class="product-tile${isOut?' out':isLow?' low':''}" onclick="addToCart('${p.id}')">
      <div class="product-name">${p.name}</div>
      <div class="product-cat">${p.category}</div>
      <div class="product-footer">
        <span class="product-price">${GH(p.price)}</span>
        <span class="product-qty${isOut?' out-text':isLow?' low-text':''}">${isOut?'Out':p.qty+' '+p.unit}</span>
      </div>
    </div>`;
  });
  html += '</div>';
  if(filtered.length===0) html+=`<div class="empty"><div class="empty-icon">🔍</div><p>No products found</p></div>`;

  document.getElementById('pos-content').innerHTML = html;
}

function cartTotal(){ return cart.reduce((a,i)=>a+(i.price*i.qty),0); }
function cartProfit(){ return cart.reduce((a,i)=>a+((i.price-i.cost)*i.qty),0); }

function addToCart(id){
  const prod = products.find(p=>p.id===id);
  if(!prod||prod.qty===0){ toast('Out of stock!','error'); return; }
  const ex = cart.find(c=>c.id===id);
  if(ex){
    if(ex.qty>=prod.qty){ toast('Max stock reached','warn'); return; }
    ex.qty++;
  } else {
    cart.push({id:prod.id,name:prod.name,price:prod.price,cost:prod.cost,qty:1,maxQty:prod.qty});
  }
  updateBadges();
  renderPOS();
}

function cartQty(id, delta){
  const item = cart.find(c=>c.id===id);
  if(!item) return;
  const prod = products.find(p=>p.id===id);
  item.qty += delta;
  if(item.qty > prod.qty){ item.qty = prod.qty; toast('Max stock reached','warn'); }
  if(item.qty <= 0){ removeFromCart(id); return; }
  updateBadges(); renderPOS();
}

function removeFromCart(id){
  cart = cart.filter(c=>c.id!==id);
  updateBadges(); renderPOS();
}

function clearCart(){ if(confirm('Clear the cart?')){ cart=[]; updateBadges(); renderPOS(); } }

function openCheckout(){
  if(cart.length===0) return;
  renderCheckout();
  openModal('checkout');
}

function renderCheckout(){
  const total = cartTotal();
  const profit = cartProfit();
  let html = `<div class="modal-header">
    <span class="modal-title">Checkout</span>
    <button class="modal-close" onclick="closeModal('checkout')">×</button>
  </div>
  <div style="max-height:220px;overflow-y:auto;margin-bottom:12px">`;
  cart.forEach(i=>{
    html+=`<div class="checkout-line"><span>${i.qty}× ${i.name}</span><span style="font-weight:600">${GH(i.price*i.qty)}</span></div>`;
  });
  html+=`</div>
  <div class="checkout-total"><span>Total</span><span style="color:var(--green-700)">${GH(total)}</span></div>
  <div style="font-size:12px;color:var(--gray-400);text-align:right;margin-bottom:12px">Est. profit: ${GH(profit)}</div>
  <div class="form-label">Payment Method</div>
  <div class="pay-pills">
    <div class="pay-pill active" id="pay-Cash" onclick="selectPay('Cash')">Cash</div>
    <div class="pay-pill" id="pay-MoMo" onclick="selectPay('MoMo')">MoMo</div>
    <div class="pay-pill" id="pay-Card" onclick="selectPay('Card')">Card</div>
    <div class="pay-pill" id="pay-Credit" onclick="selectPay('Credit')">Credit</div>
  </div>
  <div id="cash-section">
    <div class="form-group" style="margin-top:8px">
      <label class="form-label">Amount Tendered (GH₵)</label>
      <input type="number" id="amount-paid" placeholder="${total.toFixed(2)}" step="0.5" oninput="updateChange(${total})" style="font-size:16px;font-weight:600" inputmode="decimal"/>
    </div>
    <div id="change-display"></div>
  </div>
  <button class="btn btn-primary btn-full" style="margin-top:14px" onclick="completeSale()">
    Complete Sale — ${GH(total)}
  </button>`;
  document.getElementById('checkout-sheet').innerHTML = html;
  window._payMethod = 'Cash';
}

function selectPay(m){
  window._payMethod = m;
  document.querySelectorAll('.pay-pill').forEach(el=>el.classList.remove('active'));
  document.getElementById('pay-'+m).classList.add('active');
  document.getElementById('cash-section').style.display = m==='Cash'?'block':'none';
}

function updateChange(total){
  const paid = parseFloat(document.getElementById('amount-paid').value)||0;
  const change = paid - total;
  const el = document.getElementById('change-display');
  if(!paid){ el.innerHTML=''; return; }
  if(change<0){
    el.innerHTML=`<div class="change-display over"><div class="change-label">Short by</div><div class="change-val over">${GH(Math.abs(change))}</div></div>`;
  } else {
    el.innerHTML=`<div class="change-display"><div class="change-label">Change</div><div class="change-val">${GH(change)}</div></div>`;
  }
}

function completeSale(){
  const total = cartTotal();
  const profit = cartProfit();
  const method = window._payMethod||'Cash';
  if(method==='Cash'){
    const paid = parseFloat(document.getElementById('amount-paid')?.value)||0;
    if(paid < total){ toast('Insufficient payment!','error'); return; }
  }
  const sale = {
    id:'s'+Date.now(), date:todayStr(), time:now(),
    items: cart.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price,cost:i.cost})),
    total, profit, paymentMethod:method,
    amountPaid: method==='Cash'?(parseFloat(document.getElementById('amount-paid')?.value)||total):total,
  };
  // deduct stock
  cart.forEach(ci=>{
    const p = products.find(x=>x.id===ci.id);
    if(p) p.qty = Math.max(0, p.qty - ci.qty);
  });
  sales.unshift(sale);
  saveSales(); saveProducts();
  cart = [];
  closeModal('checkout');
  updateBadges();
  const change = sale.amountPaid - sale.total;
  toast(`Sale done!${method==='Cash'&&change>0?' Change: '+GH(change):''}`, 'success');
  goTab('dashboard');
}

        </div>
      </div>`;
    });
  }

  document.getElementById('inv-content').innerHTML = html;
}

function openProductDetail(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  const margin = p.price>0?(((p.price-p.cost)/p.price)*100).toFixed(1):0;
  const isLow = p.qty<=p.minQty&&p.qty>0, isOut=p.qty===0;
  let html=`<div class="modal-header">
    <span class="modal-title">${p.name}</span>
    <button class="modal-close" onclick="closeModal('detail')">×</button>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
    <div class="stat-card green"><div class="stat-label">Selling Price</div><div class="stat-value" style="font-size:18px">${GH(p.price)}</div></div>
    <div class="stat-card blue"><div class="stat-label">Cost Price</div><div class="stat-value" style="font-size:18px">${GH(p.cost)}</div></div>
    <div class="stat-card ${isOut?'red':isLow?'amber':'green'}"><div class="stat-label">In Stock</div><div class="stat-value" style="font-size:18px">${p.qty} ${p.unit}</div></div>
    <div class="stat-card amber"><div class="stat-label">Profit Margin</div><div class="stat-value" style="font-size:18px">${margin}%</div></div>
  </div>
  <div class="alert ${isOut?'error':isLow?'warn':'success'}" style="background:${isOut?'var(--red-50)':isLow?'var(--amber-50)':'var(--green-50)'};border-color:${isOut?'#fca5a5':isLow?'#fde68a':'var(--green-400)'};color:${isOut?'var(--red-600)':isLow?'var(--amber-700)':'var(--green-800)'}">
    ${isOut?'⚠️ Out of stock — restock needed':isLow?'⚠️ Low stock — reorder soon':'✓ Stock level is healthy'}
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
    <div style="background:var(--gray-50);border-radius:var(--radius);padding:10px 12px"><div style="font-size:11px;color:var(--gray-400);font-weight:600;text-transform:uppercase;letter-spacing:.4px">Category</div><div style="font-size:14px;font-weight:500;margin-top:3px">${p.category}</div></div>
    <div style="background:var(--gray-50);border-radius:var(--radius);padding:10px 12px"><div style="font-size:11px;color:var(--gray-400);font-weight:600;text-transform:uppercase;letter-spacing:.4px">Alert at</div><div style="font-size:14px;font-weight:500;margin-top:3px">${p.minQty} ${p.unit}</div></div>
    <div style="background:var(--gray-50);border-radius:var(--radius);padding:10px 12px"><div style="font-size:11px;color:var(--gray-400);font-weight:600;text-transform:uppercase;letter-spacing:.4px">Stock Value</div><div style="font-size:14px;font-weight:500;margin-top:3px">${GH(p.cost*p.qty)}</div></div>
    <div style="background:var(--gray-50);border-radius:var(--radius);padding:10px 12px"><div style="font-size:11px;color:var(--gray-400);font-weight:600;text-transform:uppercase;letter-spacing:.4px">Profit/unit</div><div style="font-size:14px;font-weight:500;margin-top:3px;color:var(--green-700)">${GH(p.price-p.cost)}</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <button class="btn btn-secondary" onclick="closeModal('detail');renderProductForm('${p.id}');openModal('product')">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Edit Product
    </button>
    <button class="btn btn-danger" onclick="deleteProduct('${p.id}')">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      Delete
    </button>
  </div>
  <button class="btn btn-amber btn-full" style="margin-top:8px" onclick="openQuickPrice('${p.id}')">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    Quick Price Edit
  </button>`;
  document.getElementById('detail-sheet').innerHTML = html;
  openModal('detail');
}

function openQuickPrice(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  closeModal('detail');
  let html=`<div class="modal-header">
    <span class="modal-title">Edit Prices — ${p.name}</span>
    <button class="modal-close" onclick="closeModal('price')">×</button>
  </div>
  <div class="alert info" style="margin-bottom:14px">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    Update prices — changes save instantly.
  </div>
  <div class="form-group">
    <label class="form-label">Selling Price (GH₵)</label>
    <input type="number" id="qp-price" value="${p.price}" step="0.5" inputmode="decimal" style="font-size:18px;font-weight:600;color:var(--green-700)"/>
    <div style="font-size:12px;color:var(--gray-400);margin-top:4px">Current: ${GH(p.price)}</div>
  </div>
  <div class="form-group">
    <label class="form-label">Cost Price (GH₵)</label>
    <input type="number" id="qp-cost" value="${p.cost}" step="0.5" inputmode="decimal"/>
    <div style="font-size:12px;color:var(--gray-400);margin-top:4px">Current: ${GH(p.cost)}</div>
  </div>
  <div class="form-group">
    <label class="form-label">Quantity in Stock</label>
    <input type="number" id="qp-qty" value="${p.qty}" min="0" inputmode="numeric"/>
  </div>
  <button class="btn btn-primary btn-full" style="margin-top:8px" onclick="saveQuickPrice('${p.id}')">Save Changes</button>`;
  document.getElementById('price-sheet').innerHTML = html;
  openModal('price');
}

function saveQuickPrice(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  const price = parseFloat(document.getElementById('qp-price').value);
  const cost  = parseFloat(document.getElementById('qp-cost').value);
  const qty   = parseInt(document.getElementById('qp-qty').value);
  if(isNaN(price)||price<=0){ toast('Enter a valid selling price','error'); return; }
  if(isNaN(cost)||cost<0){ toast('Enter a valid cost price','error'); return; }
  if(isNaN(qty)||qty<0){ toast('Enter a valid quantity','error'); return; }
  p.price = price; p.cost = cost; p.qty = qty;
  saveProducts();
  closeModal('price');
  toast('Prices updated!', 'success');
  renderInventory(); updateBadges();
}

function deleteProduct(id){
  if(!confirm('Delete this product? This cannot be undone.')) return;
  products = products.filter(p=>p.id!==id);
  saveProducts();
  closeModal('detail');
  toast('Product deleted', 'warn');
  renderInventory(); updateBadges();
}

function renderProductForm(id){
  const p = id ? products.find(x=>x.id===id) : null;
  editingProduct = p||null;
  const title = p?'Edit Product':'Add New Product';
  let catOpts = CATEGORIES.slice(1).map(c=>`<option${p&&p.category===c?' selected':''}>${c}</option>`).join('');
  let html=`<div class="modal-header">
    <span class="modal-title">${title}</span>
    <button class="modal-close" onclick="closeModal('product')">×</button>
  </div>
  <div class="form-group">
    <label class="form-label">Product Name</label>
    <input type="text" id="fp-name" value="${p?p.name:''}" placeholder="e.g. Coca-Cola 500ml" />
  </div>
  <div class="form-group">
    <label class="form-label">Category</label>
    <select id="fp-cat">${catOpts}</select>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">Selling Price (GH₵)</label>
      <input type="number" id="fp-price" value="${p?p.price:''}" placeholder="0.00" step="0.5" inputmode="decimal"/>
    </div>
    <div class="form-group">
      <label class="form-label">Cost Price (GH₵)</label>
      <input type="number" id="fp-cost" value="${p?p.cost:''}" placeholder="0.00" step="0.5" inputmode="decimal"/>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">Qty in Stock</label>
      <input type="number" id="fp-qty" value="${p?p.qty:''}" placeholder="0" min="0" inputmode="numeric"/>
    </div>
    <div class="form-group">
      <label class="form-label">Low Stock Alert</label>
      <input type="number" id="fp-minqty" value="${p?p.minQty:5}" placeholder="5" min="1" inputmode="numeric"/>
    </div>
  </div>
  <div class="form-group">
    <label class="form-label">Unit (bottle, kg, pack…)</label>
    <input type="text" id="fp-unit" value="${p?p.unit:'piece'}" placeholder="piece"/>
  </div>
  <button class="btn btn-primary btn-full" style="margin-top:6px" onclick="saveProductForm(${id?`'${id}'`:'null'})">
    ${p?'Save Changes':'Add Product'}
  </button>`;
  document.getElementById('product-form-sheet').innerHTML = html;
}

function saveProductForm(id){
  const name  = document.getElementById('fp-name').value.trim();
  const cat   = document.getElementById('fp-cat').value;
  const price = parseFloat(document.getElementById('fp-price').value);
  const cost  = parseFloat(document.getElementById('fp-cost').value);
  const qty   = parseInt(document.getElementById('fp-qty').value);
  const minQty= parseInt(document.getElementById('fp-minqty').value)||5;
  const unit  = document.getElementById('fp-unit').value.trim()||'piece';
  if(!name){ toast('Enter product name','error'); return; }
  if(isNaN(price)||price<=0){ toast('Enter valid selling price','error'); return; }
  if(isNaN(cost)||cost<0){ toast('Enter valid cost price','error'); return; }
  if(isNaN(qty)||qty<0){ toast('Enter valid quantity','error'); return; }
  if(id){
    const p = products.find(x=>x.id===id);
    Object.assign(p,{name,category:cat,price,cost,qty,minQty,unit});
    toast('Product updated!','success');
  } else {
    products.push({id:uid(),name,category:cat,price,cost,qty,minQty,unit});
    toast('Product added!','success');
  }
  saveProducts();
  closeModal('product');
  renderInventory(); updateBadges();
}

// ══════════════════════════════════════════════════
//  SALES HISTORY
// ══════════════════════════════════════════════════
function renderSales(){
  const filtered = salesDate ? sales.filter(s=>{
    const d = new Date(s.date.split('/').reverse().join('-'));
    const sel = new Date(salesDate);
    return d.toDateString()===sel.toDateString();
  }) : sales;

  const totalRev = filtered.reduce((a,s)=>a+s.total,0);
  const totalProfit = filtered.reduce((a,s)=>a+s.profit,0);

  let html=`<div style="display:flex;gap:8px;margin-bottom:12px">
    <input type="date" value="${salesDate}" onchange="salesDate=this.value;renderSales()" style="flex:1"/>
    ${salesDate?`<button class="btn btn-secondary btn-sm" onclick="salesDate='';renderSales()">Clear</button>`:''}
  </div>`;

  if(filtered.length>0){
    html+=`<div class="stats-grid" style="margin-bottom:12px">
      <div class="stat-card green"><div class="stat-label">${salesDate?'Day':'Total'} Revenue</div><div class="stat-value">${GH(totalRev)}</div></div>
      <div class="stat-card blue"><div class="stat-label">${salesDate?'Day':'Total'} Profit</div><div class="stat-value">${GH(totalProfit)}</div></div>
    </div>`;
  }

  if(filtered.length===0){ html+=`<div class="empty"><div class="empty-icon">📋</div><p>No sales found${salesDate?' for this date':''}</p></div>`; }
  else {
    filtered.forEach(s=>{
      html+=`<div class="sale-row">
        <div class="sale-row-head">
          <div>
            <div style="font-size:13px;font-weight:600">${s.date} · ${s.time}</div>
            <div class="sale-meta">${s.paymentMethod} · ${s.items.length} item${s.items.length>1?'s':''}</div>
          </div>
          <div style="text-align:right">
            <div class="sale-amount">${GH(s.total)}</div>
            <div style="font-size:11px;color:var(--gray-400)">Profit ${GH(s.profit)}</div>
          </div>
        </div>
        <div class="sale-items">${s.items.map(i=>`${i.qty}× ${i.name} — ${GH(i.price*i.qty)}`).join('<br>')}</div>
      </div>`;
    });
  }

  document.getElementById('sales-content').innerHTML = html;
}

// ══════════════════════════════════════════════════
//  REPORTS
// ══════════════════════════════════════════════════
function renderReports(){
  const totalRev = sales.reduce((a,s)=>a+s.total,0);
  const totalProfit = sales.reduce((a,s)=>a+s.profit,0);
  const margin = totalRev>0?((totalProfit/totalRev)*100).toFixed(1):0;

  // Category revenue
  const catRev = {};
  sales.forEach(s=>s.items.forEach(it=>{
    const prod = products.find(p=>p.id===it.id);
    const cat = prod?.category||'Other';
    catRev[cat]=(catRev[cat]||0)+(it.price*it.qty);
  }));
  const catArr = Object.entries(catRev).sort((a,b)=>b[1]-a[1]);
  const maxCat = catArr[0]?.[1]||1;

  // Top products
  const prodCount = {};
  sales.forEach(s=>s.items.forEach(it=>{
    prodCount[it.name]=(prodCount[it.name]||0)+it.qty;
  }));
  const topProds = Object.entries(prodCount).sort((a,b)=>b[1]-a[1]).slice(0,6);

  // Payment methods
  const payMethods = {};
  sales.forEach(s=>{ payMethods[s.paymentMethod]=(payMethods[s.paymentMethod]||0)+1; });

  let html=`<div class="stats-grid">
    <div class="stat-card green"><div class="stat-label">Total Revenue</div><div class="stat-value">${GH(totalRev)}</div></div>
    <div class="stat-card blue"><div class="stat-label">Total Profit</div><div class="stat-value">${GH(totalProfit)}</div></div>
    <div class="stat-card amber"><div class="stat-label">Profit Margin</div><div class="stat-value">${margin}%</div></div>
    <div class="stat-card red"><div class="stat-label">Total Sales</div><div class="stat-value">${sales.length}</div></div>
  </div>

  <div class="section-title">Revenue by Category</div>
  <div class="card">`;
  if(catArr.length===0){ html+=`<div class="empty" style="padding:20px"><p>No data yet</p></div>`; }
  else catArr.forEach(([cat,rev])=>{
    html+=`<div class="bar-row"><div class="bar-label"><span>${cat}</span><span>${GH(rev)}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${(rev/maxCat*100).toFixed(1)}%"></div></div></div>`;
  });
  html+=`</div>

  <div class="section-title">Top Selling Products</div>
  <div class="card">`;
  if(topProds.length===0){ html+=`<div class="empty" style="padding:20px"><p>No data yet</p></div>`; }
  else topProds.forEach(([name,qty],i)=>{
    html+=`<div class="top-item"><span class="rank-badge">${i+1}</span><span class="top-name">${name}</span><span class="top-val">${qty} sold</span></div>`;
  });
  html+=`</div>

  <div class="section-title">Payment Methods</div>
  <div class="card">`;
  if(Object.keys(payMethods).length===0){ html+=`<div class="empty" style="padding:20px"><p>No data yet</p></div>`; }
  else Object.entries(payMethods).sort((a,b)=>b[1]-a[1]).forEach(([m,c])=>{
    html+=`<div class="top-item"><span class="rank-badge" style="background:var(--blue-100);color:var(--blue-600)">${c}</span><span class="top-name">${m}</span><span class="top-val">${sales.length>0?((c/sales.length)*100).toFixed(0):0}%</span></div>`;
  });
  html+=`</div>

  <div class="section-title">Data Management</div>
  <div class="card">
    <p style="font-size:13px;color:var(--gray-600);margin-bottom:12px">Export your data as a backup or import from a previous backup.</p>
    <div class="export-row">
      <button class="btn btn-secondary" style="flex:1" onclick="exportData()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export Backup
      </button>
      <label class="btn btn-secondary" style="flex:1;cursor:pointer;text-align:center">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Import Backup
        <input type="file" accept=".json" style="display:none" onchange="importData(event)"/>
      </label>
    </div>
    <button class="btn btn-danger btn-full" style="margin-top:8px" onclick="resetAllData()">
      Reset All Data
    </button>
  </div>`;

  document.getElementById('reports-content').innerHTML = html;
}

// ══════════════════════════════════════════════════
//  DATA IMPORT / EXPORT
// ══════════════════════════════════════════════════
function exportData(){
  const data = { version:1, exportedAt:new Date().toISOString(), products, sales };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='frantreesa-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(url);
  toast('Backup downloaded!','success');
}

function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.products||!data.sales) throw new Error('Invalid format');
      if(!confirm(`Import ${data.products.length} products and ${data.sales.length} sales?\nThis will replace current data.`)) return;
      products = data.products; sales = data.sales;
      saveProducts(); saveSales();
      toast(`Imported ${products.length} products, ${sales.length} sales`,'success');
      renderReports(); updateBadges();
    }catch(err){ toast('Invalid backup file','error'); }
  };
  reader.readAsText(file);
}

function resetAllData(){
  if(!confirm('Reset ALL data? Products will revert to defaults and all sales will be deleted.')) return;
  if(!confirm('Are you sure? This cannot be undone.')) return;
  products = JSON.parse(JSON.stringify(SEED));
  sales = [];
  cart = [];
  saveProducts(); saveSales();
  toast('Data reset to defaults','warn');
  goTab('dashboard');
}

// ══════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', ()=>{
  setTimeout(()=>{
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='flex';
    renderDashboard();
    updateBadges();
  }, 600);
});
</script>
