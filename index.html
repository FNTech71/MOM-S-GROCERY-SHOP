<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#14532d"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Frantreesa Mini Mart & Cold Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
<style>
:root{
  --g900:#052e16;--g800:#14532d;--g700:#166534;--g600:#16a34a;--g500:#22c55e;
  --g200:#bbf7d0;--g100:#dcfce7;--g50:#f0fdf4;
  --a700:#b45309;--a500:#f59e0b;--a100:#fef3c7;--a50:#fffbeb;
  --r600:#dc2626;--r200:#fecaca;--r100:#fee2e2;--r50:#fff0f0;
  --b700:#1d4ed8;--b600:#2563eb;--b100:#dbeafe;--b50:#eff6ff;
  --s900:#0f172a;--s800:#1e293b;--s700:#334155;--s600:#475569;--s500:#64748b;
  --s400:#94a3b8;--s300:#cbd5e1;--s200:#e2e8f0;--s100:#f1f5f9;--s50:#f8fafc;
  --surface:#fff;--bg:#f8fafc;
  --r:8px;--rl:12px;--rxl:18px;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --font:'DM Sans',sans-serif;--font-serif:'DM Serif Display',serif;
  --sw:230px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--s800);font-size:15px;line-height:1.5;overscroll-behavior:none}
input,select,button,textarea{font-family:var(--font)}
button{cursor:pointer;border:none;background:none}
input[type=number]::-webkit-inner-spin-button{opacity:1}

/* SHELL */
#shell{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:var(--sw);background:var(--g800);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:200;flex-shrink:0}
.sl{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.sl-sub{font-size:10px;color:#86efac;letter-spacing:1.8px;text-transform:uppercase;font-weight:600;margin-bottom:2px}
.sl-main{font-family:var(--font-serif);font-size:18px;color:#fff;line-height:1.2}
.sl-tag{font-size:11px;color:rgba(255,255,255,.4);margin-top:3px}
.snav{flex:1;padding:14px 10px;overflow-y:auto}
.sni{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r);color:rgba(255,255,255,.6);cursor:pointer;transition:all .15s;margin-bottom:2px;font-size:14px;font-weight:500;border:none;background:none;width:100%;text-align:left}
.sni:hover{background:rgba(255,255,255,.08);color:#fff}
.sni.active{background:rgba(255,255,255,.15);color:#fff}
.sni svg{flex-shrink:0;opacity:.7}
.sni.active svg{opacity:1}
.sb-badge{margin-left:auto;background:var(--r600);color:#fff;font-size:10px;border-radius:10px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 4px}
.sb-badge.warn{background:var(--a500)}
.sfooter{padding:14px 16px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.3);text-align:center}

/* MAIN */
.main{margin-left:var(--sw);flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--s200);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.tb-title{font-size:17px;font-weight:600;color:var(--s800)}
.tb-right{display:flex;align-items:center;gap:10px}
.tb-alert{background:var(--a50);border:1px solid #fde68a;color:var(--a700);font-size:12px;font-weight:500;padding:5px 12px;border-radius:20px;cursor:pointer;display:none;align-items:center;gap:5px}
.content{flex:1;padding:24px 28px 40px;overflow-y:auto}

/* MOBILE HEADER */
.mob-hdr{display:none;background:var(--g800);padding:14px 16px 12px;position:sticky;top:0;z-index:100}
.mh-top{display:flex;align-items:center;justify-content:space-between}
.mh-sub{font-size:9px;color:#86efac;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
.mh-main{font-family:var(--font-serif);font-size:15px;color:#fff;margin-top:1px}
.mob-alert{background:rgba(245,158,11,.2);border:1px solid rgba(245,158,11,.4);color:#fde68a;font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;cursor:pointer;display:none}

/* BOTTOM NAV */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--s200);z-index:200;padding-bottom:env(safe-area-inset-bottom,0)}
.bnav-inner{display:flex;max-width:600px;margin:0 auto}
.nb{flex:1;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;cursor:pointer;position:relative}
.nb span{font-size:10px;color:var(--s400);font-weight:500;transition:color .15s}
.nb.active span{color:var(--g700)}
.nb-badge{position:absolute;top:4px;right:calc(50% - 18px);background:var(--r600);color:#fff;font-size:9px;border-radius:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 3px}
.nb-badge.warn{background:var(--a500)}

/* PAGES */
.page{display:none}
.page.active{display:block;animation:fu .18s ease}
@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* STATS */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.sc{background:var(--surface);border:1px solid var(--s200);border-radius:var(--rl);padding:16px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--rl) var(--rl) 0 0}
.sc.g::before{background:var(--g600)}.sc.b::before{background:var(--b600)}.sc.a::before{background:var(--a500)}.sc.r::before{background:var(--r600)}
.sl2{font-size:11px;color:var(--s500);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:5px}
.sv{font-size:22px;font-weight:700;color:var(--s900)}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--s200);border-radius:var(--rl);padding:18px 20px;box-shadow:var(--shadow)}
.ct{font-size:14px;font-weight:600;color:var(--s700);margin-bottom:14px}

/* 2 COL */
.tcol{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* BTNS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:1.5px solid transparent;white-space:nowrap}
.btn-p{background:var(--g700);color:#fff;border-color:var(--g700)}.btn-p:hover{background:var(--g800)}
.btn-s{background:var(--s100);color:var(--s700);border-color:var(--s200)}.btn-s:hover{background:var(--s200)}
.btn-d{background:var(--r100);color:var(--r600);border-color:var(--r200)}.btn-d:hover{background:var(--r200)}
.btn-a{background:var(--a50);color:var(--a700);border-color:#fde68a}.btn-a:hover{background:var(--a100)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-full{width:100%;padding:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* INPUTS */
input,select{border:1.5px solid var(--s200);border-radius:var(--r);padding:9px 12px;font-size:14px;color:var(--s800);background:var(--surface);width:100%;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--g600)}

/* SEARCH */
.sw{position:relative}.sw input{padding-left:36px}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--s400);pointer-events:none}

/* PILLS */
.pscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;flex-wrap:wrap}
.pscroll::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--s200);color:var(--s500);background:var(--surface);transition:all .15s;white-space:nowrap}
.pill.active{background:var(--g700);color:#fff;border-color:var(--g700)}

/* PRODUCT GRID */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:10px}
.ptile{background:var(--surface);border:1px solid var(--s200);border-radius:var(--rl);padding:13px 14px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.ptile:hover{border-color:var(--g500);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.ptile:active{transform:scale(.97)}
.ptile.out{opacity:.45;pointer-events:none}
.ptile.low{border-color:#fde68a}
.pn{font-size:13px;font-weight:500;color:var(--s800);line-height:1.3;margin-bottom:3px}
.pc{font-size:11px;color:var(--s400);margin-bottom:8px}
.pf{display:flex;justify-content:space-between;align-items:center}
.pp{font-size:15px;font-weight:700;color:var(--g700)}
.pq{font-size:11px;color:var(--s400)}.pq.lw{color:var(--a700);font-weight:600}.pq.ot{color:var(--r600);font-weight:600}

/* CART */
.pos-wrap{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.cart-panel{background:var(--surface);border:1px solid var(--s200);border-radius:var(--rl);padding:18px;box-shadow:var(--shadow);position:sticky;top:84px}
.ci{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--s100)}
.ci:last-child{border-bottom:none}
.cn{flex:1;font-size:13px;font-weight:500;color:var(--s700)}
.qc{display:flex;align-items:center;gap:4px}
.qb{width:26px;height:26px;border-radius:6px;background:var(--s100);color:var(--s600);font-size:16px;display:flex;align-items:center;justify-content:center;border:1px solid var(--s200);transition:background .12s}
.qb:hover{background:var(--s200)}
.qn{font-size:13px;font-weight:600;min-width:22px;text-align:center}
.cs{font-size:13px;font-weight:600;color:var(--g700);min-width:62px;text-align:right}
.rb{color:var(--s300);font-size:18px;line-height:1;padding:0 2px;transition:color .1s}
.rb:hover{color:var(--r600)}
.ce{text-align:center;padding:32px 16px;color:var(--s400)}
.ctr{display:flex;justify-content:space-between;align-items:center;padding:12px 0 0;margin-top:6px;border-top:2px solid var(--s200)}

/* INV TABLE */
.inv-tbl{width:100%;border-collapse:collapse}
.inv-tbl th{font-size:11px;font-weight:600;color:var(--s500);text-transform:uppercase;letter-spacing:.6px;padding:10px 14px;border-bottom:2px solid var(--s200);text-align:left;background:var(--s50)}
.inv-tbl td{padding:12px 14px;border-bottom:1px solid var(--s100);font-size:13px;color:var(--s700)}
.inv-tbl tr:hover td{background:var(--s50)}
.inv-tbl tr:last-child td{border-bottom:none}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0}
.abtns{display:flex;gap:6px}

/* SALE ROWS */
.srow{background:var(--surface);border:1px solid var(--s200);border-radius:var(--rl);padding:14px 16px;margin-bottom:8px;box-shadow:var(--shadow)}
.srh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.sa{font-size:16px;font-weight:700;color:var(--g700)}
.sm{font-size:11px;color:var(--s400);margin-top:2px}
.sit{font-size:12px;color:var(--s500);border-top:1px solid var(--s100);padding-top:7px}

/* ALERT */
.alert{border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:13px;display:flex;align-items:flex-start;gap:8px}
.alert.warn{background:var(--a50);border:1px solid #fde68a;color:var(--a700)}
.alert.info{background:var(--b50);border:1px solid #bfdbfe;color:var(--b600)}
.alert.ok{background:var(--g50);border:1px solid var(--g200);color:var(--g700)}

/* MODALS */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center;animation:fi .15s ease;padding:16px}
.mov.hidden{display:none}
@keyframes fi{from{opacity:0}to{opacity:1}}
.mbox{background:var(--surface);border-radius:var(--rxl);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:24px 24px 28px;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:si .2s ease}
@keyframes si{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.mt{font-size:17px;font-weight:600;color:var(--s900)}
.mc{width:32px;height:32px;border-radius:50%;background:var(--s100);color:var(--s600);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;transition:background .12s}
.mc:hover{background:var(--s200)}
.fg{margin-bottom:14px}
.fl{font-size:11px;font-weight:600;color:var(--s600);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* CHECKOUT */
.chl{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px solid var(--s100)}
.cht{display:flex;justify-content:space-between;padding:14px 0 0;font-size:18px;font-weight:700;border-top:2px solid var(--s200);margin-top:8px}
.ppills{display:flex;gap:8px;margin:8px 0 14px}
.ppill{flex:1;padding:9px;border-radius:var(--r);border:1.5px solid var(--s200);background:var(--surface);font-size:13px;font-weight:500;color:var(--s500);cursor:pointer;text-align:center;transition:all .15s}
.ppill.active{background:var(--g50);border-color:var(--g600);color:var(--g800)}
.cbox{background:var(--g50);border:1.5px solid var(--g200);border-radius:var(--r);padding:12px;text-align:center;margin-top:10px}
.cbox.short{background:var(--r50);border-color:var(--r200)}
.cvl{font-size:24px;font-weight:700;color:var(--g700);margin-top:2px}
.cvl.short{color:var(--r600)}

/* BAR */
.br{margin-bottom:10px}
.brl{display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px;color:var(--s700)}
.brt{height:8px;background:var(--s100);border-radius:4px;overflow:hidden}
.brf{height:100%;background:var(--g600);border-radius:4px;transition:width .6s ease}
.ti{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--s100)}
.ti:last-child{border-bottom:none}
.rk{width:22px;height:22px;border-radius:50%;background:var(--g100);color:var(--g800);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* TOAST */
#toast{position:fixed;top:20px;right:24px;background:var(--s900);color:#fff;padding:10px 18px;border-radius:var(--r);font-size:13px;z-index:9999;opacity:0;transform:translateY(-8px);transition:all .25s;pointer-events:none;max-width:340px;box-shadow:var(--shadow-md)}
#toast.show{opacity:1;transform:translateY(0)}
#toast.success{background:var(--g800)}
#toast.error{background:var(--r600)}
#toast.warn{background:var(--a700)}

/* SECTION TITLE */
.stl{font-size:12px;font-weight:600;color:var(--s500);text-transform:uppercase;letter-spacing:.8px;margin:20px 0 10px}
.stl:first-child{margin-top:0}

/* EMPTY */
.empty{text-align:center;padding:48px 24px;color:var(--s400)}
.empty-icon{font-size:44px;margin-bottom:12px}
.empty p{font-size:14px}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--g800);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9999}
.brand{font-family:var(--font-serif);font-size:26px;color:#fff;text-align:center}
.brand small{display:block;font-family:var(--font);font-size:13px;color:rgba(255,255,255,.45);margin-top:4px;font-style:normal}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* === RESPONSIVE MOBILE ≤768px === */
@media(max-width:768px){
  .sidebar,.topbar{display:none}
  .mob-hdr{display:block}
  .bnav{display:block}
  .main{margin-left:0}
  .content{padding:12px 14px 80px}
  .sgrid{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .sv{font-size:18px}
  .tcol{grid-template-columns:1fr}
  .pos-wrap{grid-template-columns:1fr}
  .cart-panel{position:static}
  .pgrid{grid-template-columns:1fr 1fr;gap:8px}
  .inv-tbl{display:none}
  .inv-clist{display:block!important}
  .mov{align-items:flex-end;padding:0}
  .mbox{border-radius:var(--rxl) var(--rxl) 0 0;max-height:92vh;padding:20px 18px 32px}
  #toast{top:auto;bottom:90px;right:50%;transform:translateX(50%) translateY(8px);text-align:center}
  #toast.show{transform:translateX(50%) translateY(0)}
}
@media(min-width:769px){
  .inv-clist{display:none}
  .cart-mob-only{display:none}
}
</style>
</head>
<body>
<div id="loading">
  <div class="brand">Frantreesa<small>Mini Mart & Cold Store</small></div>
  <div class="spinner"></div>
</div>

<div id="shell" style="display:none">
  <aside class="sidebar">
    <div class="sl">
      <div class="sl-sub">Frantreesa</div>
      <div class="sl-main">Mini Mart &amp;<br>Cold Store</div>
      <div class="sl-tag">Management System</div>
    </div>
    <nav class="snav">
      <button class="sni active" id="snav-dashboard" onclick="goTab('dashboard')">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </button>
      <button class="sni" id="snav-pos" onclick="goTab('pos')">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        Point of Sale
        <span id="snav-cart" class="sb-badge" style="display:none"></span>
      </button>
      <button class="sni" id="snav-inventory" onclick="goTab('inventory')">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        Inventory
        <span id="snav-stock" class="sb-badge warn" style="display:none"></span>
      </button>
      <button class="sni" id="snav-sales" onclick="goTab('sales')">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Sales History
      </button>
      <button class="sni" id="snav-reports" onclick="goTab('reports')">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
        Reports
      </button>
    </nav>
    <div class="sfooter" id="sidebar-date"></div>
  </aside>

  <div class="main">
    <div class="mob-hdr">
      <div class="mh-top">
        <div><div class="mh-sub">Frantreesa</div><div class="mh-main">Mini Mart & Cold Store</div></div>
        <div id="mob-alert" class="mob-alert" onclick="goTab('inventory')"></div>
      </div>
    </div>

    <div class="topbar">
      <div class="tb-title" id="tb-title">Dashboard</div>
      <div class="tb-right">
        <span id="tb-date" style="font-size:12px;color:var(--s400)"></span>
        <div id="tb-alert" class="tb-alert" onclick="goTab('inventory')">

let products=DB.get('products')||SEED;
let sales=DB.get('sales')||[];
let cart=[];
let activeTab='dashboard';
let posSearch='',posCat='All',invSearch='',invCat='All',salesDate='';
const GH=n=>'GH₵ '+Number(n).toFixed(2);
const uid=()=>'p'+Date.now()+Math.random().toString(36).slice(2,6);
const todayStr=()=>new Date().toLocaleDateString('en-GB');
const nowStr=()=>new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
function saveProducts(){DB.set('products',products)}
function saveSales(){DB.set('sales',sales)}
function toast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className='show '+type;clearTimeout(t._t);t._t=setTimeout(()=>t.className='',3000);}
function openModal(id){document.getElementById('modal-'+id).classList.remove('hidden')}
function closeModal(id){document.getElementById('modal-'+id).classList.add('hidden')}
const PTITLES={dashboard:'Dashboard',pos:'Point of Sale',inventory:'Inventory',sales:'Sales History',reports:'Reports & Analytics'};
function goTab(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nb,.sni').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.getElementById('nav-'+tab)?.classList.add('active');

  activeTab=tab;
  if(tab==='dashboard')renderDash();
  else if(tab==='pos')renderPOS();
  else if(tab==='inventory')renderInv();
  else if(tab==='sales')renderSales();
  else if(tab==='reports')renderReports();
  updateBadges();
}
function updateBadges(){
  const low=products.filter(p=>p.qty<=p.minQty);
  const cc=cart.reduce((a,i)=>a+i.qty,0);
  ['cart-badge','snav-cart'].forEach(id=>{const el=document.getElementById(id);if(el){el.style.display=cc>0?'flex':'none';el.textContent=cc;}});
  ['stock-badge','snav-stock'].forEach(id=>{const el=document.getElementById(id);if(el){el.style.display=low.length>0?'flex':'none';el.textContent=low.length;}});
  const msg=low.length>0?low.length+' item'+(low.length>1?'s':'')+' low on stock':'';
  const ta=document.getElementById('tb-alert');const ma=document.getElementById('mob-alert');
  if(ta){ta.style.display=msg?'flex':'none';document.getElementById('tb-alert-txt').textContent=msg;}
  if(ma){ma.style.display=msg?'block':'none';ma.textContent=msg;}
}

/* DASHBOARD */
function renderDash(){
  const today=todayStr(),ts=sales.filter(s=>s.date===today);
  const rev=ts.reduce((a,s)=>a+s.total,0),profit=ts.reduce((a,s)=>a+s.profit,0);
  const sv=products.reduce((a,p)=>a+(p.cost*p.qty),0);
  const low=products.filter(p=>p.qty<=p.minQty&&p.qty>0),out=products.filter(p=>p.qty===0);
  const aRev=sales.reduce((a,s)=>a+s.total,0),aProfit=sales.reduce((a,s)=>a+s.profit,0);
  let h=`<div class="sgrid">
    <div class="sc g"><div class="sl2">Today Revenue</div><div class="sv">${GH(rev)}</div></div>
    <div class="sc b"><div class="sl2">Today Profit</div><div class="sv">${GH(profit)}</div></div>
    <div class="sc a"><div class="sl2">Today Sales</div><div class="sv">${ts.length}</div></div>
    <div class="sc r"><div class="sl2">Stock Value</div><div class="sv">${GH(sv)}</div></div>
  </div>`;
  if(low.length||out.length) h+=`<div class="alert warn"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0;margin-top:1px"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span>${low.length} item${low.length!==1?'s':''} low${out.length?' · '+out.length+' out of stock':''}. <a href="#" onclick="goTab('inventory');return false" style="color:inherit;font-weight:600;text-decoration:underline">View →</a></span></div>`;
  h+=`<div class="tcol"><div>
    <div class="stl">Quick Actions</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px">
      <button class="btn btn-p" onclick="goTab('pos')" style="padding:16px 10px;font-size:14px"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>New Sale</button>
      <button class="btn btn-s" onclick="goTab('inventory')" style="padding:16px 10px;font-size:14px"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add Product</button>
      <button class="btn btn-s" onclick="goTab('sales')" style="padding:12px 10px">Sales Log</button>
      <button class="btn btn-s" onclick="goTab('reports')" style="padding:12px 10px">Reports</button>
    </div>
    <div class="stl">All-Time Summary</div>
    <div class="card" style="margin-bottom:14px">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
        <div style="text-align:center"><div style="font-size:11px;color:var(--s400);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Revenue</div><div style="font-size:17px;font-weight:700;color:var(--g700)">${GH(aRev)}</div></div>
        <div style="text-align:center;border-left:1px solid var(--s100);border-right:1px solid var(--s100)"><div style="font-size:11px;color:var(--s400);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Profit</div><div style="font-size:17px;font-weight:700;color:var(--b600)">${GH(aProfit)}</div></div>
        <div style="text-align:center"><div style="font-size:11px;color:var(--s400);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Sales</div><div style="font-size:17px;font-weight:700;color:var(--s700)">${sales.length}</div></div>
      </div>
    </div>
  </div>
  <div>
    <div class="stl">Recent Sales</div>
    <div class="card" style="padding:0;overflow:hidden">`;
  if(!sales.length) h+=`<div class="empty" style="padding:32px"><div class="empty-icon">🛒</div><p>No sales yet. Tap New Sale!</p></div>`;
  else{h+=`<div style="max-height:340px;overflow-y:auto">`;sales.slice(0,10).forEach(s=>{h+=`<div style="padding:12px 16px;border-bottom:1px solid var(--s100);display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:13px;font-weight:500;color:var(--s700)">${s.items.length} item${s.items.length>1?'s':''} · ${s.paymentMethod}</div><div style="font-size:11px;color:var(--s400);margin-top:1px">${s.date} · ${s.time}</div></div><div style="text-align:right"><div style="font-size:14px;font-weight:700;color:var(--g700)">${GH(s.total)}</div><div style="font-size:11px;color:var(--s400)">+${GH(s.profit)}</div></div></div>`;});h+=`</div>`;}
  h+=`</div></div></div>`;
  document.getElementById('dc').innerHTML=h;
}

/* POS */
function renderPOS(){
  const mob=window.innerWidth<=768;
  const cats=['All',...new Set(products.map(p=>p.category))];
  const filtered=products.filter(p=>{
    const mc=posCat==='All'||p.category===posCat;
    const ms=p.name.toLowerCase().includes(posSearch.toLowerCase())||p.category.toLowerCase().includes(posSearch.toLowerCase());
    return mc&&ms;
  });
  let h='';
  if(mob&&cart.length>0){
    const total=cartTotal();
    h+=`<div class="card" style="margin-bottom:12px;border-color:var(--g200)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span style="font-size:13px;font-weight:600">Cart (${cart.reduce((a,i)=>a+i.qty,0)})</span><button class="btn btn-sm btn-d" onclick="clearCart()">Clear</button></div>`;
    cart.forEach(item=>{h+=`<div class="ci"><span class="cn">${item.name}</span><div class="qc"><button class="qb" onclick="cartQty('${item.id}',-1)">−</button><span class="qn">${item.qty}</span><button class="qb" onclick="cartQty('${item.id}',1)">+</button></div><span class="cs">${GH(item.price*item.qty)}</span><button class="rb" onclick="removeFromCart('${item.id}')">×</button></div>`;});
    h+=`<div class="ctr"><span style="font-size:16px;font-weight:700">Total: ${GH(total)}</span><button class="btn btn-p" onclick="openCheckout()">Checkout →</button></div></div>`;
  }
  h+=`<div style="${mob?'':'display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start'}"><div>
    <div class="sw" style="margin-bottom:10px"><svg class="si" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="Search products..." value="${posSearch}" oninput="posSearch=this.value;renderPOS()"/></div>
    <div class="pscroll" style="margin-bottom:10px">`;
  cats.slice(0,12).forEach(c=>{h+=`<div class="pill${posCat===c?' active':''}" onclick="posCat='${c}';renderPOS()">${c}</div>`;});
  h+=`</div><div class="pgrid">`;
  filtered.forEach(p=>{
    const isOut=p.qty===0,isLow=p.qty>0&&p.qty<=p.minQty;
    h+=`<div class="ptile${isOut?' out':isLow?' low':''}" onclick="addToCart('${p.id}')"><div class="pn">${p.name}</div><div class="pc">${p.category}</div><div class="pf"><span class="pp">${GH(p.price)}</span><span class="pq${isOut?' ot':isLow?' lw':''}">${isOut?'Out':p.qty+' '+p.unit}</span></div></div>`;
  });
  if(!filtered.length) h+=`<div style="grid-column:1/-1"><div class="empty"><div class="empty-icon">🔍</div><p>No products found</p></div></div>`;
  h+=`</div></div>`;
  if(!mob){
    const total=cartTotal();
    h+=`<div class="cart-panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span style="font-size:14px;font-weight:600;color:var(--s700)">Cart</span>${cart.length?`<button class="btn btn-sm btn-d" onclick="clearCart()">Clear</button>`:''}</div>`;
    if(!cart.length) h+=`<div class="ce"><svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="opacity:.25;margin-bottom:8px"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><p>Tap a product to add</p></div>`;
    else{
      h+=`<div style="max-height:calc(100vh - 340px);overflow-y:auto">`;
      cart.forEach(item=>{h+=`<div class="ci"><span class="cn">${item.name}</span><div class="qc"><button class="qb" onclick="cartQty('${item.id}',-1)">−</button><span class="qn">${item.qty}</span><button class="qb" onclick="cartQty('${item.id}',1)">+</button></div><span class="cs">${GH(item.price*item.qty)}</span><button class="rb" onclick="removeFromCart('${item.id}')">×</button></div>`;});
      h+=`</div><div class="ctr"><span style="font-size:16px;font-weight:700">Total: ${GH(total)}</span></div><div style="font-size:12px;color:var(--s400);text-align:right;margin:4px 0 12px">Est. profit: ${GH(cartProfit())}</div><button class="btn btn-p btn-full" onclick="openCheckout()"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Checkout — ${GH(total)}</button>`;
    }
    h+=`</div>`;
  }
  h+=`</div>`;
  document.getElementById('pc').innerHTML=h;
}
function cartTotal(){return cart.reduce((a,i)=>a+(i.price*i.qty),0)}
function cartProfit(){return cart.reduce((a,i)=>a+((i.price-i.cost)*i.qty),0)}
function addToCart(id){
  const p=products.find(x=>x.id===id);if(!p||p.qty===0){toast('Out of stock!','error');return;}
  const ex=cart.find(c=>c.id===id);
  if(ex){if(ex.qty>=p.qty){toast('Max stock reached','warn');return;}ex.qty++;}
  else cart.push({id:p.id,name:p.name,price:p.price,cost:p.cost,qty:1});
  updateBadges();renderPOS();
}
function cartQty(id,d){
  const item=cart.find(c=>c.id===id);if(!item)return;
  const p=products.find(x=>x.id===id);
  item.qty+=d;
  if(item.qty>p.qty){item.qty=p.qty;toast('Max stock reached','warn');}
  if(item.qty<=0){removeFromCart(id);return;}
  updateBadges();renderPOS();
}
function removeFromCart(id){cart=cart.filter(c=>c.id!==id);updateBadges();renderPOS();}
function clearCart(){if(confirm('Clear the cart?')){cart=[];updateBadges();renderPOS();}}
function openCheckout(){
  if(!cart.length)return;
  const total=cartTotal(),profit=cartProfit();
  let h=`<div class="mh"><span class="mt">Complete Sale</span><button class="mc" onclick="closeModal('checkout')">×</button></div>
  <div style="max-height:220px;overflow-y:auto;margin-bottom:12px">`;
  cart.forEach(i=>{h+=`<div class="chl"><span>${i.qty}× ${i.name}</span><span style="font-weight:600">${GH(i.price*i.qty)}</span></div>`;});
  h+=`</div><div class="cht"><span>Total</span><span style="color:var(--g700)">${GH(total)}</span></div>
  <div style="font-size:12px;color:var(--s400);text-align:right;margin-bottom:14px">Est. profit: ${GH(profit)}</div>
  <label style="font-size:11px;font-weight:600;color:var(--s600);text-transform:uppercase;letter-spacing:.5px">Payment Method</label>
  <div class="ppills"><div class="ppill active" id="pay-Cash" onclick="selPay('Cash')">Cash</div><div class="ppill" id="pay-MoMo" onclick="selPay('MoMo')">MoMo</div><div class="ppill" id="pay-Card" onclick="selPay('Card')">Card</div><div class="ppill" id="pay-Credit" onclick="selPay('Credit')">Credit</div></div>
  <div id="cash-sec">
    <div class="fg"><label class="fl">Amount Tendered (GH₵)</label><input type="number" id="amt" placeholder="${total.toFixed(2)}" step="0.5" oninput="calcChange(${total})" inputmode="decimal" style="font-size:18px;font-weight:600"/></div>
    <div id="change-out"></div>
  </div>
  <button class="btn btn-p btn-full" style="margin-top:14px" onclick="completeSale()">Complete Sale — ${GH(total)}</button>`;
  document.getElementById('mbox-checkout').innerHTML=h;
  window._pay='Cash';
  openModal('checkout');
}
function selPay(m){window._pay=m;document.querySelectorAll('.ppill').forEach(e=>e.classList.remove('active'));document.getElementById('pay-'+m).classList.add('active');document.getElementById('cash-sec').style.display=m==='Cash'?'block':'none';}
function calcChange(t){
  const paid=parseFloat(document.getElementById('amt').value)||0;
  const d=paid-t,el=document.getElementById('change-out');
  if(!paid){el.innerHTML='';return;}
  el.innerHTML=d<0?`<div class="cbox short"><div style="font-size:11px;color:var(--s500);text-transform:uppercase;letter-spacing:.5px;font-weight:600">Short by</div><div class="cvl short">${GH(Math.abs(d))}</div></div>`:`<div class="cbox"><div style="font-size:11px;color:var(--s500);text-transform:uppercase;letter-spacing:.5px;font-weight:600">Change to give</div><div class="cvl">${GH(d)}</div></div>`;
}
function completeSale(){
  const total=cartTotal(),profit=cartProfit(),method=window._pay||'Cash';
  if(method==='Cash'){const paid=parseFloat(document.getElementById('amt')?.value)||0;if(paid<total){toast('Insufficient payment!','error');return;}}
  const sale={id:'s'+Date.now(),date:todayStr(),time:nowStr(),items:cart.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price,cost:i.cost})),total,profit,paymentMethod:method,amountPaid:method==='Cash'?(parseFloat(document.getElementById('amt')?.value)||total):total};
  cart.forEach(ci=>{const p=products.find(x=>x.id===ci.id);if(p)p.qty=Math.max(0,p.qty-ci.qty);});
  sales.unshift(sale);saveSales();saveProducts();cart=[];closeModal('checkout');updateBadges();
  const chg=sale.amountPaid-sale.total;
  toast('Sale complete!'+(method==='Cash'&&chg>0?' Change: '+GH(chg):''),'success');goTab('dashboard');
}

/* SALES */
function renderSales(){
  const filtered=salesDate?sales.filter(s=>{

/* REPORTS */

  h+=`</div></div>
    <div>
      <div class="stl">Top Selling Products</div>

  h+=`</div>
      <div class="stl">Inventory Summary</div>
      <div class="card">
        <div class="ti"><span class="rk" style="background:var(--g100);color:var(--g800)">${products.length}</span><span style="flex:1;font-size:13px;font-weight:500;color:var(--s700)">Total Products</span></div>
        <div class="ti"><span class="rk" style="background:var(--a100);color:var(--a700)">${products.filter(p=>p.qty<=p.minQty&&p.qty>0).length}</span><span style="flex:1;font-size:13px;font-weight:500;color:var(--s700)">Low Stock</span></div>
        <div class="ti"><span class="rk" style="background:var(--r100);color:var(--r600)">${products.filter(p=>p.qty===0).length}</span><span style="flex:1;font-size:13px;font-weight:500;color:var(--s700)">Out of Stock</span></div>
        <div class="ti"><span style="font-size:13px;font-weight:700;color:var(--g700)">${GH(products.reduce((a,p)=>a+(p.cost*p.qty),0))}</span><span style="flex:1;font-size:13px;font-weight:500;color:var(--s700);margin-left:10px">Total Stock Value</span></div>
      </div>
    </div>
  </div>
  <div class="stl">Data Management</div>
  <div class="card">
    <p style="font-size:13px;color:var(--s500);margin-bottom:14px">Export your shop data as a backup file, or import a previous backup to restore data.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-s" onclick="exportData()"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export Backup (.json)</button>
      <label class="btn btn-s" style="cursor:pointer"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Import Backup<input type="file" accept=".json" style="display:none" onchange="importData(event)"/></label>
      <button class="btn btn-d" onclick="resetAllData()">Reset All Data</button>
    </div>
  </div>`;
  document.getElementById('rc').innerHTML=h;
}

function exportData(){
  const blob=new Blob([JSON.stringify({version:3,exportedAt:new Date().toISOString(),products,sales},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='frantreesa-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported!','success');
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!d.products||!d.sales)throw 0;if(!confirm(`Import ${d.products.length} products and ${d.sales.length} sales? Replaces current data.`))return;products=d.products;sales=d.sales;saveProducts();saveSales();toast(`Imported ${products.length} products, ${sales.length} sales`,'success');renderReports();updateBadges();}catch{toast('Invalid backup file','error');}};
  r.readAsText(file);
}
function resetAllData(){
  if(!confirm('Reset ALL data to factory defaults?'))return;
  if(!confirm('This deletes all sales history. Sure?'))return;
  products=JSON.parse(JSON.stringify(SEED));sales=[];cart=[];saveProducts();saveSales();
  toast('Data reset','warn');goTab('dashboard');
}

window.addEventListener('DOMContentLoaded',()=>{
  const d=new Date();
  document.getElementById('sidebar-date').textContent=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('tb-date').textContent=d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  setTimeout(()=>{
    document.getElementById('loading').style.display='none';
    document.getElementById('shell').style.display='flex';
    renderDash();updateBadges();
  },600);
  window.addEventListener('resize',()=>{if(activeTab==='pos')renderPOS();if(activeTab==='inventory')renderInv();});
});
</script>
</body>
</html>
